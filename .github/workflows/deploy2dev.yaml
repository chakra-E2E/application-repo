name: deploy to dev
on:
  workflow_dispatch:
    inputs:
      project:
        type: string
        required: true
      component:
        type: string
        required: true
      subscription:
        type: string
        required: true
        default: '406682759639'
      decription: 
        type: string
        required: false
        default: "Triggering dev workflow"
      environment:
        type: string
        required: false
        default: dev
jobs:
  dev-pipeline:
    if: github.ref == 'refs/heads/main'
    uses: chakra-E2E/Devops-workflows/.github/workflows/dev-workflow.yaml@main
    permissions:
      contents: read
      statuses: write
    with:
        project: ${{ inputs.project }}
        component: ${{ inputs.component }}
        subscription: ${{ inputs.subscription }}
        description: ${{ inputs.description }}
        environment: ${{ inputs.environment }}
    secrets: inherit